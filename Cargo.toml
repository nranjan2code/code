[workspace]
resolver = "2"
members = [
    "crates/vak-llm",
    "crates/vak-delivery",
    "crates/vak-tools",
    "crates/vak-ops",
    "crates/vak-tray",
    "crates/vak-tui",
    "crates/vak-desktop",
    "crates/vak-domain",
    "crates/vak-storage",
    "crates/vak-services",
    "crates/vak-runtime",
    "crates/vak-config",
    "crates/vak-session",
    "crates/vak-agent",
    "crates/vak-server",
    "crates/vak-client",
    "crates/vakcoder",
]

[workspace.package]
version = "0.9.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/vakcoder/vakcoder"

[workspace.dependencies]
vak-llm = { path = "crates/vak-llm" }
vak-tools = { path = "crates/vak-tools" }
vak-ops = { path = "crates/vak-ops" }
vak-tui = { path = "crates/vak-tui" }
vak-domain = { path = "crates/vak-domain" }
vak-storage = { path = "crates/vak-storage" }
vak-services = { path = "crates/vak-services" }
vak-runtime = { path = "crates/vak-runtime" }
vak-config = { path = "crates/vak-config" }
vak-session = { path = "crates/vak-session" }
vak-agent = { path = "crates/vak-agent" }
vak-server = { path = "crates/vak-server" }
vak-client = { path = "crates/vak-client" }

crossterm = { version = "0.28", features = ["event-stream"] }
# HTTP+SSE server for the headless agent (tokio-native standard)
axum = { version = "0.8", features = ["json"] }
tokio-stream = { version = "0.1", features = ["sync"] }
# CORS so browser/webview surfaces (tauri://localhost, vite dev) can reach it
tower-http = { version = "0.6", features = ["cors"] }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
walkdir = "2"
# checkpoint file-content encoding
base64 = "0.22"
# Constant-time token comparison for auth (timing-attack resistance)
subtle = "2"
# OS CSPRNG used to mint the local gateway bearer token during `self install`
getrandom = "0.3"
# Embeds the built admin SPA (crates/vak-admin-ui/dist) into the binary
include_dir = "0.7"
globset = "0.4"
similar = { version = "2", features = ["text"] }
libc = "0.2"
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
# Release artifact integrity; updater rejects bytes that do not match the signed feed.
sha2 = "=0.10.9"
async-stream = "0.3"
# Linux filesystem containment: safe wrapper over the Landlock LSM syscalls
landlock = "0.4"
# Desktop shell (docs/design/20-tauri-desktop.md): native webview + Rust host
tauri = "2.11"
# Static assets/context codegen for the tauri app at compile time
tauri-build = "2.6"
tauri-plugin-dialog = "2.7"
tauri-plugin-notification = "2.3"
# Enforces one running instance; a second launch refocuses the first window
tauri-plugin-single-instance = "2.3"
# Menu-bar controller (vak-tray): native tray icon + event loop
tray-icon = "0.21"
winit = "0.30"
notify-rust = "4"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "deny"

[profile.release]
lto = "thin"
strip = "symbols"
