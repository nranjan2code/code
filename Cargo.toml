[workspace]
resolver = "2"
members = [
    "crates/vak-llm",
    "crates/vak-session",
    "crates/vak-tools",
    "crates/vak-agent",
    "crates/vak-config",
    "crates/vak-core",
    "crates/vak-tui",
    "crates/vakcoder",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/vakcoder/vakcoder"

[workspace.dependencies]
vak-llm = { path = "crates/vak-llm" }
vak-session = { path = "crates/vak-session" }
vak-tools = { path = "crates/vak-tools" }
vak-agent = { path = "crates/vak-agent" }
vak-config = { path = "crates/vak-config" }
vak-core = { path = "crates/vak-core" }
vak-tui = { path = "crates/vak-tui" }

crossterm = { version = "0.28", features = ["event-stream"] }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
walkdir = "2"
globset = "0.4"
similar = { version = "2", features = ["text"] }
libc = "0.2"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "deny"

[profile.release]
lto = "thin"
strip = "symbols"
