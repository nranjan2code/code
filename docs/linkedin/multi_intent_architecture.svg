<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap');
      .font { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .bg { fill: #11161d; }
      .bg-split { fill: #171f2a; }
      .card-white { fill: #fbfbf9; stroke: #e2e8f0; stroke-width: 2; rx: 16px; }
      .card-dark { fill: #1b2432; stroke: #2d3b4e; stroke-width: 2; rx: 16px; }
      .text-hero { font-size: 52px; font-weight: 800; fill: #ffffff; letter-spacing: -1.5px; line-height: 1.15; }
      .text-sub { font-size: 22px; font-weight: 400; fill: #94a3b8; line-height: 1.4; }
    </style>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" class="bg" />
  <path d="M 1150,0 L 1920,0 L 1920,1080 L 950,1080 Z" class="bg-split" opacity="0.65" />

  <!-- HEADER -->
  <g transform="translate(100, 70)">
    <text x="0" y="45" class="font text-hero">The Multi-Intent Architecture</text>
    <text x="0" y="85" class="font text-sub">How Vak decodes compound requests without falling into the Single-Label Argmax Trap</text>
  </g>

  <!-- PROMPT BAR (TOP) -->
  <g transform="translate(100, 195)" filter="url(#card-shadow)">
    <rect width="1720" height="96" fill="#1e2838" stroke="#334155" stroke-width="2" rx="14" />
    <text x="32" y="38" class="font" font-size="13" font-weight="700" fill="#f59e0b" letter-spacing="1">COMPOUND USER PROMPT (SINGLE TURN)</text>
    <text x="32" y="70" class="mono" font-size="20" font-weight="600" fill="#f8fafc">"Find the authentication vulnerability in auth.rs, refactor the token parser, and verify tests pass."</text>
  </g>

  <!-- LEFT PANEL: THE ARGMAX FAILURE (TRADITIONAL) -->
  <g transform="translate(100, 325)" filter="url(#card-shadow)">
    <rect width="830" height="680" class="card-white" />
    
    <!-- Title strip -->
    <rect width="830" height="64" fill="#fee2e2" rx="16" />
    <rect y="48" width="830" height="16" fill="#fee2e2" />
    <circle cx="36" cy="32" r="8" fill="#ef4444" />
    <text x="60" y="38" class="font" font-size="18" font-weight="700" fill="#991b1b">TRADITIONAL AGENTS: THE ARGMAX TRAP</text>

    <!-- Subtitle -->
    <text x="36" y="105" class="font" font-size="16" fill="#64748b">1D classifiers force a single winner, dropping all sibling capability requirements:</text>

    <!-- Argmax Steps -->
    <g transform="translate(36, 130)">
      <!-- Step 1 -->
      <rect width="758" height="90" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="10" />
      <text x="24" y="32" class="font" font-size="14" font-weight="700" fill="#475569">STEP 1: TEXT CLASSIFICATION</text>
      <text x="24" y="60" class="mono" font-size="16" fill="#0f172a">Winner: Modify (Score 3.2)  |  Locate (2.4) [DROPPED]  |  Verify (2.8) [DROPPED]</text>
    </g>

    <g transform="translate(36, 240)">
      <!-- Step 2 -->
      <rect width="758" height="90" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="10" />
      <text x="24" y="32" class="font" font-size="14" font-weight="700" fill="#dc2626">STEP 2: STARVED CAPABILITY SLICE</text>
      <text x="24" y="60" class="mono" font-size="16" fill="#dc2626">Tools admitted: [edit, write]. Observability &amp; search tools removed!</text>
    </g>

    <g transform="translate(36, 350)">
      <!-- Step 3 -->
      <rect width="758" height="120" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" rx="10" />
      <text x="24" y="32" class="font" font-size="14" font-weight="700" fill="#b91c1c">STEP 3: RUNTIME HALLUCINATION / CRASH</text>
      <text x="24" y="62" class="font" font-size="15" fill="#7f1d1d">• Model cannot inspect file contents (no grep/search tools).</text>
      <text x="24" y="88" class="font" font-size="15" fill="#7f1d1d">• Model edits blind, says "tests pass" in prose without ever executing bash.</text>
    </g>

    <g transform="translate(36, 495)">
      <rect width="758" height="135" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" rx="10" />
      <text x="24" y="32" class="font" font-size="14" font-weight="700" fill="#334155">ROOT CAUSE</text>
      <text x="24" y="62" class="font" font-size="15" fill="#475569">Single-label argmax assumes compound clauses are rivals.</text>
      <text x="24" y="88" class="font" font-size="15" fill="#475569">In reality, "modify" and "verify" in the same turn are cooperative requirements.</text>
      <text x="24" y="114" class="font" font-size="15" font-weight="600" fill="#0f172a">Discarding contenders starves the agent of the very tools it was ordered to use.</text>
    </g>
  </g>

  <!-- RIGHT PANEL: VAK'S CONTENDER BAND + UNION SLICING -->
  <g transform="translate(990, 325)" filter="url(#card-shadow)">
    <rect width="830" height="680" class="card-white" />
    
    <!-- Title strip -->
    <rect width="830" height="64" fill="#dcfce7" rx="16" />
    <rect y="48" width="830" height="16" fill="#dcfce7" />
    <circle cx="36" cy="32" r="8" fill="#10b981" />
    <text x="60" y="38" class="font" font-size="18" font-weight="700" fill="#14532d">VAK: CONTENDER BAND &amp; UNION CAPABILITY SLICE</text>

    <!-- Subtitle -->
    <text x="36" y="105" class="font" font-size="16" fill="#64748b">Algebraic retention captures compound intent without capability starvation:</text>

    <!-- Vak Steps -->
    <g transform="translate(36, 130)">
      <!-- Step 1 -->
      <rect width="758" height="90" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" rx="10" />
      <text x="24" y="32" class="font" font-size="14" font-weight="700" fill="#15803d">STEP 1: ACT CONTENDER BAND (ACT_BAND = 0.5)</text>
      <text x="24" y="60" class="mono" font-size="16" fill="#0f172a">Primary: Modify (3.2)  |  Contenders: Verify (2.8), Locate (2.4) ≥ 50% max</text>
    </g>

    <g transform="translate(36, 240)">
      <!-- Step 2 -->
      <rect width="758" height="90" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" rx="10" />
      <text x="24" y="32" class="font" font-size="14" font-weight="700" fill="#15803d">STEP 2: UNION CAPABILITY DERIVATION</text>
      <text x="24" y="60" class="mono" font-size="16" fill="#0f172a">Domains: floor ∪ acts(Modify, Verify, Locate) → [fs, mem, code-exec, obs]</text>
    </g>

    <g transform="translate(36, 350)">
      <!-- Step 3 -->
      <rect width="758" height="120" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" rx="10" />
      <text x="24" y="32" class="font" font-size="14" font-weight="700" fill="#1d4ed8">STEP 3: HIGHEST-CAUTION SAFETY COMPOSITION</text>
      <text x="24" y="62" class="font" font-size="15" fill="#1e3a8a">• Stakes: Reversible (Modify) &gt; Inert (Locate) → Automated checkpoint taken.</text>
      <text x="24" y="88" class="font" font-size="15" fill="#1e3a8a">• Evidence: Verified (Verify) → Satisfaction floor set to Observed.</text>
    </g>

    <g transform="translate(36, 495)">
      <rect width="758" height="135" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" rx="10" />
      <text x="24" y="32" class="font" font-size="14" font-weight="700" fill="#065f46">STOP-GUARD RECEIPT VERIFICATION</text>
      <text x="24" y="62" class="font" font-size="15" fill="#047857">ReceiptSummary tracks execution in real time.</text>
      <text x="24" y="88" class="font" font-size="15" fill="#047857">If files changed after test run: VerificationStale blocks completion.</text>
      <text x="24" y="114" class="font" font-size="15" font-weight="600" fill="#064e3b">No self-reported "done": the agent cannot quit until every intent is proved.</text>
    </g>
  </g>
</svg>
