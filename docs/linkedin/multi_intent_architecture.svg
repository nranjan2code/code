<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      .font { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .bg-canvas { fill: #f8fafc; }
      .card-white { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16px; }
      .text-hero { font-size: 44px; font-weight: 900; fill: #0f172a; letter-spacing: -1px; }
      .text-sub { font-size: 20px; font-weight: 500; fill: #475569; }
    </style>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Clean Light Canvas -->
  <rect width="1920" height="1080" class="bg-canvas" />

  <!-- HEADER -->
  <g transform="translate(80, 55)">
    <text x="0" y="44" class="font text-hero">The Multi-Intent Architecture</text>
    <text x="0" y="80" class="font text-sub">How Vak decodes compound requests without falling into the Single-Label Argmax Trap</text>
  </g>

  <!-- PROMPT BAR (TOP) -->
  <g transform="translate(80, 160)" filter="url(#shadow)">
    <rect width="1760" height="96" fill="#ffffff" stroke="#93c5fd" stroke-width="2" rx="14" />
    <rect x="24" y="16" width="280" height="24" fill="#dbeafe" rx="5" />
    <text x="34" y="32" class="font" font-size="11" font-weight="800" fill="#1d4ed8" letter-spacing="1">COMPOUND USER PROMPT (SINGLE TURN)</text>
    <text x="24" y="68" class="mono" font-size="18" font-weight="700" fill="#0f172a">"Find the authentication vulnerability in auth.rs, refactor the token parser, and verify tests pass."</text>
  </g>

  <!-- LEFT PANEL: THE ARGMAX FAILURE (TRADITIONAL) -->
  <g transform="translate(80, 280)" filter="url(#shadow)">
    <rect width="860" height="730" class="card-white" />
    
    <!-- Title strip -->
    <rect width="860" height="64" fill="#fee2e2" rx="16" />
    <rect y="48" width="860" height="16" fill="#fee2e2" />
    <circle cx="36" cy="32" r="8" fill="#ef4444" />
    <text x="60" y="38" class="font" font-size="18" font-weight="800" fill="#991b1b">TRADITIONAL AGENTS: THE ARGMAX TRAP</text>

    <text x="36" y="105" class="font" font-size="15" font-weight="500" fill="#64748b">1D classifiers force a single winner, dropping all sibling capability requirements:</text>

    <!-- Argmax Steps -->
    <g transform="translate(36, 130)">
      <rect width="788" height="95" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="10" />
      <text x="24" y="32" class="font" font-size="14" font-weight="800" fill="#475569">STEP 1: TEXT CLASSIFICATION</text>
      <text x="24" y="62" class="mono" font-size="14" font-weight="700" fill="#0f172a">Winner: Modify (Score 3.2)  |  Locate (2.4) [DROPPED]  |  Verify (2.8) [DROPPED]</text>
    </g>

    <g transform="translate(36, 245)">
      <rect width="788" height="95" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="10" />
      <text x="24" y="32" class="font" font-size="14" font-weight="800" fill="#b91c1c">STEP 2: STARVED CAPABILITY SLICE</text>
      <text x="24" y="62" class="mono" font-size="14" font-weight="700" fill="#b91c1c">Tools Loaded: [edit_file]  (grep, read_file, bash stripped to save tokens)</text>
    </g>

    <g transform="translate(36, 360)">
      <rect width="788" height="150" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" rx="10" />
      <text x="24" y="32" class="font" font-size="14" font-weight="800" fill="#991b1b">STEP 3: RUNTIME BLINDNESS &amp; HALLUCINATION</text>
      <text x="24" y="62" class="font" font-size="14" font-weight="600" fill="#7f1d1d">1. Cannot search for auth.rs (grep stripped) → Hallucinates file path</text>
      <text x="24" y="90" class="font" font-size="14" font-weight="600" fill="#7f1d1d">2. Modifies incorrect line → Cannot run tests (bash stripped)</text>
      <text x="24" y="118" class="font" font-size="14" font-weight="600" fill="#7f1d1d">3. Hallucinates success: "I have refactored the parser and verified tests pass!"</text>
    </g>

    <g transform="translate(36, 530)">
      <rect width="788" height="160" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="10" />
      <text x="24" y="32" class="font" font-size="15" font-weight="800" fill="#0f172a">FAILURE OUTCOME:</text>
      <text x="24" y="64" class="font" font-size="14" fill="#334155">• 2 out of 3 user intents silently dropped</text>
      <text x="24" y="92" class="font" font-size="14" fill="#334155">• Code broken on disk without verification</text>
      <text x="24" y="120" class="font" font-size="14" font-weight="700" fill="#b91c1c">• False sense of completion reported to the human</text>
    </g>
  </g>

  <!-- RIGHT PANEL: THE VAK SOLUTION -->
  <g transform="translate(980, 280)" filter="url(#shadow)">
    <rect width="860" height="730" class="card-white" stroke="#2563eb" stroke-width="2.5" />
    
    <!-- Title strip -->
    <rect width="860" height="64" fill="#eff6ff" rx="16" />
    <rect y="48" width="860" height="16" fill="#eff6ff" />
    <circle cx="36" cy="32" r="8" fill="#2563eb" />
    <text x="60" y="38" class="font" font-size="18" font-weight="800" fill="#1e3a8a">VAK: CONTENDER BAND &amp; CAPABILITY UNION</text>

    <text x="36" y="105" class="font" font-size="15" font-weight="500" fill="#64748b">Admit all acts within 50% of the winner, unioning required tools:</text>

    <!-- Vak Steps -->
    <g transform="translate(36, 130)">
      <rect width="788" height="95" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" rx="10" />
      <text x="24" y="32" class="font" font-size="14" font-weight="800" fill="#15803d">STEP 1: CONTENDERS BAND (50%)</text>
      <text x="24" y="62" class="mono" font-size="14" font-weight="700" fill="#14532d">Acts Admitted: {Modify (3.2), Verify (2.8), Locate (2.4)} — ALL ADMITTED</text>
    </g>

    <g transform="translate(36, 245)">
      <rect width="788" height="95" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" rx="10" />
      <text x="24" y="32" class="font" font-size="14" font-weight="800" fill="#15803d">STEP 2: FULL CAPABILITY UNION</text>
      <text x="24" y="62" class="mono" font-size="14" font-weight="700" fill="#14532d">Capability Slice: [read_file, grep, edit_file, bash] (No tool starvation)</text>
    </g>

    <g transform="translate(36, 360)">
      <rect width="788" height="150" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" rx="10" />
      <text x="24" y="32" class="font" font-size="14" font-weight="800" fill="#1e40af">STEP 3: AUDITED MULTI-INTENT EXECUTION</text>
      <text x="24" y="62" class="font" font-size="14" font-weight="600" fill="#1e3a8a">1. Locate: ripgrep searches auth.rs for token handling → Found lines 45-80</text>
      <text x="24" y="90" class="font" font-size="14" font-weight="600" fill="#1e3a8a">2. Modify: Replaces parser with claims schema → Diffs recorded to ledger</text>
      <text x="24" y="118" class="font" font-size="14" font-weight="600" fill="#1e3a8a">3. StopGuard: Forces verification execution (cargo test exits 0) before closing</text>
    </g>

    <g transform="translate(36, 530)">
      <rect width="788" height="160" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="10" />
      <text x="24" y="32" class="font" font-size="15" font-weight="800" fill="#0f172a">VERIFIED SUCCESS OUTCOME:</text>
      <text x="24" y="64" class="font" font-size="14" font-weight="600" fill="#065f46">✓ All 3 compound intents fully executed</text>
      <text x="24" y="92" class="font" font-size="14" font-weight="600" fill="#065f46">✓ Runtime receipts confirm exit 0 on test suite</text>
      <text x="24" y="120" class="font" font-size="14" font-weight="700" fill="#1d4ed8">✓ Mathematical non-widening guarantee enforced by bounded semilattice</text>
    </g>
  </g>
</svg>
