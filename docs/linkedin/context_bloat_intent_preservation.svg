<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap');
      .font { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .bg { fill: #11161d; }
      .bg-split { fill: #18202c; }
      .card-white { fill: #fbfbf9; stroke: #e2e8f0; stroke-width: 2; rx: 16px; }
      .card-dark { fill: #1c2534; stroke: #334155; stroke-width: 2; rx: 16px; }
      .text-hero { font-size: 50px; font-weight: 800; fill: #ffffff; letter-spacing: -1.5px; line-height: 1.15; }
      .text-sub { font-size: 22px; font-weight: 400; fill: #94a3b8; line-height: 1.4; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" class="bg" />
  <path d="M 1250,0 L 1920,0 L 1920,1080 L 1050,1080 Z" class="bg-split" opacity="0.5" />

  <!-- HEADER -->
  <g transform="translate(100, 70)">
    <text x="0" y="45" class="font text-hero">Preserving Intent Across Long Horizons</text>
    <text x="0" y="85" class="font text-sub">How Vak prevents attention drift, survives context bloating, and enforces outcome delivery across N turns</text>
  </g>

  <!-- 3 COLUMN ARCHITECTURE -->

  <!-- COLUMN 1: CONTEXT COMPACTOR & LEDGER -->
  <g transform="translate(100, 190)" filter="url(#shadow)">
    <rect width="530" height="810" class="card-white" />
    <rect width="530" height="60" fill="#f1f5f9" rx="16" />
    <rect y="46" width="530" height="14" fill="#f1f5f9" />
    <text x="28" y="38" class="font" font-size="18" font-weight="700" fill="#0f172a">1. IMMUTABLE LEDGER &amp; COMPACTOR</text>

    <g transform="translate(28, 85)">
      <rect width="474" height="120" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="10" />
      <text x="20" y="30" class="font" font-size="14" font-weight="700" fill="#2563eb">APPEND-ONLY SESSION LEDGER</text>
      <text x="20" y="56" class="font" font-size="14" fill="#475569">• Invariant 1 &amp; 2: Never rewrite or delete turns</text>
      <text x="20" y="80" class="font" font-size="14" fill="#475569">• Original prompt pinned at session root</text>
      <text x="20" y="104" class="font" font-size="14" fill="#475569">• Every tool result preserved on disk in JSONL</text>
    </g>

    <g transform="translate(28, 225)">
      <rect width="474" height="150" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="10" />
      <text x="20" y="30" class="font" font-size="14" font-weight="700" fill="#2563eb">API-VALID BOUNDARY SNAPPING</text>
      <text x="20" y="56" class="font" font-size="14" fill="#475569">• Compaction snaps forward past tool outputs</text>
      <text x="20" y="80" class="font" font-size="14" fill="#475569">• NEVER splits tool_use and tool_result pairs</text>
      <text x="20" y="104" class="font" font-size="14" fill="#475569">• Kept tail remains 100% syntactically valid</text>
      <text x="20" y="128" class="font" font-size="14" fill="#475569">• Prevents LLM context corruption crashes</text>
    </g>

    <g transform="translate(28, 395)">
      <rect width="474" height="170" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" rx="10" />
      <text x="20" y="30" class="font" font-size="14" font-weight="700" fill="#1d4ed8">MANDATORY PRESERVATION CONTRACT</text>
      <text x="20" y="56" class="font" font-size="13" fill="#1e40af">Compaction system prompt strictly mandates:</text>
      <text x="20" y="82" class="mono" font-size="12" font-weight="600" fill="#1e3a8a">"Keep: original task, current state, paths,</text>
      <text x="20" y="102" class="mono" font-size="12" font-weight="600" fill="#1e3a8a"> key decisions, fixes, and open items."</text>
      <text x="20" y="132" class="font" font-size="13" fill="#1e40af">• Drops pleasantries &amp; verbose tool outputs</text>
      <text x="20" y="154" class="font" font-size="13" fill="#1e40af">• Injected at index 0 of every projected turn</text>
    </g>

    <g transform="translate(28, 585)">
      <rect width="474" height="195" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="10" />
      <text x="20" y="30" class="font" font-size="14" font-weight="700" fill="#0f172a">PROJECTED CONTEXT STRUCTURE</text>
      <rect x="20" y="45" width="434" height="35" fill="#dbeafe" rx="6" />
      <text x="35" y="68" class="mono" font-size="12" font-weight="600" fill="#1e40af">&lt;context_summary&gt; Original Task + Open Items</text>
      <rect x="20" y="90" width="434" height="35" fill="#f1f5f9" rx="6" />
      <text x="35" y="113" class="mono" font-size="12" fill="#475569">Recent Turn [k-2]: Verbatim Tool Result</text>
      <rect x="20" y="135" width="434" height="40" fill="#ecfdf5" stroke="#10b981" stroke-width="1" rx="6" />
      <text x="35" y="160" class="mono" font-size="12" font-weight="600" fill="#065f46">Active Turn [k]: Next Multi-Intent Step</text>
    </g>
  </g>

  <!-- COLUMN 2: COMMITMENT KERNEL & WORK CONTRACTS -->
  <g transform="translate(695, 190)" filter="url(#shadow)">
    <rect width="530" height="810" class="card-white" />
    <rect width="530" height="60" fill="#f1f5f9" rx="16" />
    <rect y="46" width="530" height="14" fill="#f1f5f9" />
    <text x="28" y="38" class="font" font-size="18" font-weight="700" fill="#0f172a">2. EXTERNAL COMMITMENT KERNEL</text>

    <g transform="translate(28, 85)">
      <rect width="474" height="120" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="10" />
      <text x="20" y="30" class="font" font-size="14" font-weight="700" fill="#7c3aed">DECOUPLED FROM CONTEXT TOKENS</text>
      <text x="20" y="56" class="font" font-size="14" fill="#475569">• Persisted in dedicated commitment ledger</text>
      <text x="20" y="80" class="font" font-size="14" fill="#475569">• Outlives sessions, compactors, and restarts</text>
      <text x="20" y="104" class="font" font-size="14" fill="#475569">• State machine: Proposed → Active → Closed</text>
    </g>

    <g transform="translate(28, 225)">
      <rect width="474" height="150" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" rx="10" />
      <text x="20" y="30" class="font" font-size="14" font-weight="700" fill="#6d28d9">THE SATISFACTION LATTICE</text>
      <text x="20" y="56" class="mono" font-size="13" font-weight="600" fill="#5b21b6">Asserted &lt; Cited &lt; Observed &lt; Attested</text>
      <text x="20" y="84" class="font" font-size="13" fill="#6b21a8">• Semantic claims = Asserted (lowest rank)</text>
      <text x="20" y="106" class="font" font-size="13" fill="#6b21a8">• Command Exit 0 / File Exists = Observed</text>
      <text x="20" y="128" class="font" font-size="13" fill="#6b21a8">• CLOSURE INVARIANT: Cannot close on Asserted</text>
    </g>

    <g transform="translate(28, 395)">
      <rect width="474" height="170" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" rx="10" />
      <text x="20" y="30" class="font" font-size="14" font-weight="700" fill="#be123c">FORBIDDEN SELF-CERTIFICATION</text>
      <text x="20" y="56" class="font" font-size="13" fill="#9f1239">Model events CANNOT transition work items:</text>
      <text x="20" y="82" class="mono" font-size="12" font-weight="600" fill="#881337">WorkError::ModelCompletion(item_id)</text>
      <text x="20" y="110" class="font" font-size="13" fill="#9f1239">• The model claiming "I'm done" is ignored</text>
      <text x="20" y="132" class="font" font-size="13" fill="#9f1239">• Only runtime audit commands confirm truth</text>
      <text x="20" y="154" class="font" font-size="13" fill="#9f1239">• Context memory loss cannot falsify status</text>
    </g>

    <g transform="translate(28, 585)">
      <rect width="474" height="195" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="10" />
      <text x="20" y="30" class="font" font-size="14" font-weight="700" fill="#0f172a">MANAGED WORK CONTRACT DAG</text>
      <text x="20" y="56" class="font" font-size="13" fill="#475569">Multi-intent requests compile into explicit items:</text>
      <rect x="20" y="70" width="434" height="30" fill="#f1f5f9" rx="5" />
      <text x="35" y="90" class="mono" font-size="12" fill="#334155">Item 1: Fix SQL injection [SUCCEEDED - Observed]</text>
      <rect x="20" y="108" width="434" height="30" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="5" />
      <text x="35" y="128" class="mono" font-size="12" font-weight="600" fill="#92400e">Item 2: Run test suite [PENDING - Required]</text>
      <rect x="20" y="146" width="434" height="30" fill="#f1f5f9" rx="5" />
      <text x="35" y="166" class="mono" font-size="12" fill="#334155">Item 3: Generate docs [PENDING - Blocked on 2]</text>
    </g>
  </g>

  <!-- COLUMN 3: STOP GUARDS & TASK ISOLATION -->
  <g transform="translate(1290, 190)" filter="url(#shadow)">
    <rect width="530" height="810" class="card-white" />
    <rect width="530" height="60" fill="#f1f5f9" rx="16" />
    <rect y="46" width="530" height="14" fill="#f1f5f9" />
    <text x="28" y="38" class="font" font-size="18" font-weight="700" fill="#0f172a">3. STOP GUARDS &amp; SUBAGENT ISOLATION</text>

    <g transform="translate(28, 85)">
      <rect width="474" height="120" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="10" />
      <text x="20" y="30" class="font" font-size="14" font-weight="700" fill="#059669">PREMATURE EXIT INTERCEPTION</text>
      <text x="20" y="56" class="font" font-size="14" fill="#475569">• Intercepts model finish before turn returns</text>
      <text x="20" y="80" class="font" font-size="14" fill="#475569">• Inspects ReceiptSummary execution audit</text>
      <text x="20" y="104" class="font" font-size="14" fill="#475569">• Injects assertive steering prompt on failure</text>
    </g>

    <g transform="translate(28, 225)">
      <rect width="474" height="190" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" rx="10" />
      <text x="20" y="30" class="font" font-size="14" font-weight="700" fill="#047857">THE THREE STOP-GUARD AUDITS</text>
      <text x="20" y="60" class="font" font-size="13" font-weight="700" fill="#065f46">1. TruncatedPlan</text>
      <text x="20" y="80" class="font" font-size="13" fill="#047857">Unsatisfied contract items or missing sub-intents.</text>
      <text x="20" y="105" class="font" font-size="13" font-weight="700" fill="#065f46">2. VerificationMissing</text>
      <text x="20" y="125" class="font" font-size="13" fill="#047857">Code/files modified without any test execution.</text>
      <text x="20" y="150" class="font" font-size="13" font-weight="700" fill="#065f46">3. VerificationStale</text>
      <text x="20" y="170" class="font" font-size="13" fill="#047857">Edits occurred AFTER tests; must re-verify.</text>
    </g>

    <g transform="translate(28, 435)">
      <rect width="474" height="170" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" rx="10" />
      <text x="20" y="30" class="font" font-size="14" font-weight="700" fill="#1d4ed8">TASKTOOL: SUBAGENT DE-BLOATING</text>
      <text x="20" y="56" class="font" font-size="13" fill="#1e40af">• Heavy intents delegated to depth-1 subagents</text>
      <text x="20" y="78" class="font" font-size="13" fill="#1e40af">• Isolated session ledger and token budget</text>
      <text x="20" y="100" class="font" font-size="13" fill="#1e40af">• Child executes dozens of intermediate turns</text>
      <text x="20" y="122" class="font" font-size="13" fill="#1e40af">• Returns ONLY typed TaskOutcome work receipt</text>
      <text x="20" y="146" class="font" font-size="13" font-weight="700" fill="#1e3a8a">Zero transcript pollution in parent context!</text>
    </g>

    <g transform="translate(28, 625)">
      <rect width="474" height="155" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="10" />
      <text x="20" y="30" class="font" font-size="14" font-weight="700" fill="#0f172a">OUTCOME: ZERO INTENT LOSS</text>
      <text x="20" y="56" class="font" font-size="13" fill="#475569">Whether a task takes 2 turns or 50 turns:</text>
      <text x="20" y="80" class="font" font-size="13" fill="#475569">• Every sub-goal is tracked until observed</text>
      <text x="20" y="104" class="font" font-size="13" fill="#475569">• Context window stays clean and focused</text>
      <text x="20" y="128" class="font" font-size="13" fill="#475569">• Outcomes delivered with machine-audited proof</text>
    </g>
  </g>
</svg>
