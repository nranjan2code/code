<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      .font { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .bg-canvas { fill: #f8fafc; }
      .card-white { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16px; }
      .box-blue { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; rx: 10px; }
      .box-green { fill: #ecfdf5; stroke: #86efac; stroke-width: 1.5; rx: 10px; }
      .box-purple { fill: #faf5ff; stroke: #d8b4fe; stroke-width: 1.5; rx: 10px; }
      .box-red { fill: #fef2f2; stroke: #fca5a5; stroke-width: 1.5; rx: 10px; }
      .box-gray { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; rx: 10px; }
    </style>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Crisp Light Canvas -->
  <rect width="1920" height="1080" class="bg-canvas" />

  <!-- HEADER -->
  <g transform="translate(80, 55)">
    <text x="0" y="44" class="font" font-size="44" font-weight="900" fill="#0f172a" letter-spacing="-1px">Preserving Intent Across Long Horizons</text>
    <text x="0" y="80" class="font" font-size="20" font-weight="500" fill="#475569">How Vak survives context bloating, prevents LLM attention drift, and guarantees outcome delivery across N turns</text>
  </g>

  <!-- 3 COLUMN ARCHITECTURE -->

  <!-- COLUMN 1: CONTEXT COMPACTOR & LEDGER -->
  <g transform="translate(80, 160)" filter="url(#shadow)">
    <rect width="550" height="860" class="card-white" />
    <rect width="550" height="65" fill="#f1f5f9" rx="16" />
    <rect y="45" width="550" height="20" fill="#f1f5f9" />
    <line x1="0" y1="65" x2="550" y2="65" stroke="#cbd5e1" stroke-width="2" />
    <text x="28" y="42" class="font" font-size="18" font-weight="800" fill="#0f172a" letter-spacing="0.5px">1. IMMUTABLE LEDGER &amp; COMPACTOR</text>

    <!-- Block 1.1 -->
    <g transform="translate(28, 90)">
      <rect width="494" height="130" class="box-blue" />
      <text x="20" y="32" class="font" font-size="15" font-weight="800" fill="#1e40af">APPEND-ONLY SESSION LEDGER</text>
      <text x="20" y="60" class="font" font-size="13" font-weight="600" fill="#1e3a8a">• Invariant 1 &amp; 2: Never rewrite or delete turns</text>
      <text x="20" y="84" class="font" font-size="13" font-weight="600" fill="#1e3a8a">• Original compound prompt pinned at session root</text>
      <text x="20" y="108" class="font" font-size="13" font-weight="600" fill="#1e3a8a">• Reconstructable truth via derive_messages()</text>
    </g>

    <!-- Block 1.2 -->
    <g transform="translate(28, 240)">
      <rect width="494" height="160" class="box-gray" />
      <text x="20" y="32" class="font" font-size="15" font-weight="800" fill="#0f172a">API-VALID BOUNDARY SNAPPING</text>
      <text x="20" y="60" class="font" font-size="13" fill="#334155">• Compaction snaps forward past tool outputs</text>
      <text x="20" y="84" class="font" font-size="13" font-weight="700" fill="#b91c1c">• NEVER splits tool_use and tool_result pairs</text>
      <text x="20" y="108" class="font" font-size="13" fill="#334155">• Kept tail remains 100% syntactically valid</text>
      <text x="20" y="132" class="font" font-size="13" fill="#334155">• Eliminates mid-run provider parse crashes</text>
    </g>

    <!-- Block 1.3 -->
    <g transform="translate(28, 420)">
      <rect width="494" height="185" class="box-blue" />
      <text x="20" y="32" class="font" font-size="15" font-weight="800" fill="#1e40af">MANDATORY PRESERVATION CONTRACT</text>
      <text x="20" y="58" class="font" font-size="13" font-weight="600" fill="#1e3a8a">Compaction prompt enforces structured contract:</text>
      <rect x="20" y="70" width="454" height="50" fill="#ffffff" stroke="#93c5fd" rx="6" />
      <text x="30" y="92" class="mono" font-size="12" font-weight="700" fill="#1e3a8a">"Keep: original task, current state, paths,</text>
      <text x="30" y="110" class="mono" font-size="12" font-weight="700" fill="#1e3a8a"> key decisions, fixes, and open items."</text>
      <text x="20" y="146" class="font" font-size="13" fill="#1e3a8a">• Strips polite filler and verbose log noise</text>
      <text x="20" y="168" class="font" font-size="13" font-weight="700" fill="#1d4ed8">• Injected at index 0 of every projected turn</text>
    </g>

    <!-- Block 1.4 -->
    <g transform="translate(28, 625)">
      <rect width="494" height="205" class="box-gray" />
      <text x="20" y="32" class="font" font-size="15" font-weight="800" fill="#0f172a">PROJECTED CONTEXT STRUCTURE</text>
      
      <rect x="20" y="50" width="454" height="38" fill="#dbeafe" stroke="#93c5fd" rx="6" />
      <text x="32" y="74" class="mono" font-size="12" font-weight="700" fill="#1e40af">&lt;context_summary&gt; Original Task + Open Items</text>

      <rect x="20" y="98" width="454" height="38" fill="#ffffff" stroke="#cbd5e1" rx="6" />
      <text x="32" y="122" class="mono" font-size="12" fill="#475569">Recent Turn [k-2]: Verbatim Tool Result</text>

      <rect x="20" y="146" width="454" height="42" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" rx="6" />
      <text x="32" y="172" class="mono" font-size="12" font-weight="700" fill="#065f46">Active Turn [k]: Next Multi-Intent Step</text>
    </g>
  </g>

  <!-- COLUMN 2: COMMITMENT KERNEL & WORK CONTRACTS -->
  <g transform="translate(685, 160)" filter="url(#shadow)">
    <rect width="550" height="860" class="card-white" />
    <rect width="550" height="65" fill="#f1f5f9" rx="16" />
    <rect y="45" width="550" height="20" fill="#f1f5f9" />
    <line x1="0" y1="65" x2="550" y2="65" stroke="#cbd5e1" stroke-width="2" />
    <text x="28" y="42" class="font" font-size="18" font-weight="800" fill="#0f172a" letter-spacing="0.5px">2. EXTERNAL COMMITMENT KERNEL</text>

    <!-- Block 2.1 -->
    <g transform="translate(28, 90)">
      <rect width="494" height="130" class="box-purple" />
      <text x="20" y="32" class="font" font-size="15" font-weight="800" fill="#6b21a8">DECOUPLED FROM CONTEXT TOKENS</text>
      <text x="20" y="60" class="font" font-size="13" font-weight="600" fill="#581c87">• Stored outside context in commitments/ ledger</text>
      <text x="20" y="84" class="font" font-size="13" font-weight="600" fill="#581c87">• Outlives sessions, compactors, and restarts</text>
      <text x="20" y="108" class="font" font-size="13" font-weight="600" fill="#581c87">• State machine: Proposed → Active → Closed</text>
    </g>

    <!-- Block 2.2 -->
    <g transform="translate(28, 240)">
      <rect width="494" height="160" class="box-purple" />
      <text x="20" y="32" class="font" font-size="15" font-weight="800" fill="#6b21a8">THE SATISFACTION LATTICE</text>
      <rect x="20" y="48" width="454" height="34" fill="#ffffff" stroke="#c084fc" rx="6" />
      <text x="32" y="70" class="mono" font-size="13" font-weight="700" fill="#6b21a8">Asserted &lt; Cited &lt; Observed &lt; Attested</text>
      <text x="20" y="106" class="font" font-size="13" fill="#581c87">• Semantic claims = Asserted (lowest rank)</text>
      <text x="20" y="128" class="font" font-size="13" fill="#581c87">• Command Exit 0 / File Exists = Observed</text>
      <text x="20" y="150" class="font" font-size="13" font-weight="700" fill="#4c1d95">• INVARIANT: Cannot close on Asserted weight</text>
    </g>

    <!-- Block 2.3 -->
    <g transform="translate(28, 420)">
      <rect width="494" height="185" class="box-red" />
      <text x="20" y="32" class="font" font-size="15" font-weight="800" fill="#991b1b">FORBIDDEN SELF-CERTIFICATION</text>
      <text x="20" y="58" class="font" font-size="13" font-weight="600" fill="#7f1d1d">Model events CANNOT transition work items:</text>
      <rect x="20" y="70" width="454" height="38" fill="#ffffff" stroke="#fca5a5" rx="6" />
      <text x="32" y="94" class="mono" font-size="12" font-weight="700" fill="#991b1b">WorkError::ModelCompletion(item_id)</text>
      <text x="20" y="130" class="font" font-size="13" fill="#7f1d1d">• Model claims of "I'm done" are rejected</text>
      <text x="20" y="152" class="font" font-size="13" fill="#7f1d1d">• Only runtime audit commands confirm truth</text>
      <text x="20" y="174" class="font" font-size="13" font-weight="700" fill="#b91c1c">• Context memory loss cannot falsify status</text>
    </g>

    <!-- Block 2.4 -->
    <g transform="translate(28, 625)">
      <rect width="494" height="205" class="box-gray" />
      <text x="20" y="32" class="font" font-size="15" font-weight="800" fill="#0f172a">MANAGED WORK CONTRACT DAG</text>
      <text x="20" y="54" class="font" font-size="12" fill="#475569">Compound intents compile into explicit items:</text>
      
      <rect x="20" y="68" width="454" height="34" fill="#ecfdf5" stroke="#86efac" rx="6" />
      <text x="32" y="90" class="mono" font-size="12" font-weight="700" fill="#065f46">Item 1: Fix SQL injection [SUCCEEDED - Observed]</text>

      <rect x="20" y="110" width="454" height="34" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" rx="6" />
      <text x="32" y="132" class="mono" font-size="12" font-weight="700" fill="#92400e">Item 2: Run test suite [PENDING - Required]</text>

      <rect x="20" y="152" width="454" height="34" fill="#f1f5f9" stroke="#cbd5e1" rx="6" />
      <text x="32" y="174" class="mono" font-size="12" fill="#475569">Item 3: Generate docs [PENDING - Blocked on 2]</text>
    </g>
  </g>

  <!-- COLUMN 3: STOP GUARDS & TASK ISOLATION -->
  <g transform="translate(1290, 160)" filter="url(#shadow)">
    <rect width="550" height="860" class="card-white" />
    <rect width="550" height="65" fill="#f1f5f9" rx="16" />
    <rect y="45" width="550" height="20" fill="#f1f5f9" />
    <line x1="0" y1="65" x2="550" y2="65" stroke="#cbd5e1" stroke-width="2" />
    <text x="28" y="42" class="font" font-size="18" font-weight="800" fill="#0f172a" letter-spacing="0.5px">3. STOP GUARDS &amp; WORKERS</text>

    <!-- Block 3.1 -->
    <g transform="translate(28, 90)">
      <rect width="494" height="130" class="box-green" />
      <text x="20" y="32" class="font" font-size="15" font-weight="800" fill="#065f46">PREMATURE EXIT INTERCEPTION</text>
      <text x="20" y="60" class="font" font-size="13" font-weight="600" fill="#047857">• Intercepts model finish before turn returns</text>
      <text x="20" y="84" class="font" font-size="13" font-weight="600" fill="#047857">• Audits concrete tool ReceiptSummary</text>
      <text x="20" y="108" class="font" font-size="13" font-weight="600" fill="#047857">• Injects corrective feedback if intent is missing</text>
    </g>

    <!-- Block 3.2 -->
    <g transform="translate(28, 240)">
      <rect width="494" height="195" class="box-green" />
      <text x="20" y="32" class="font" font-size="15" font-weight="800" fill="#065f46">THE THREE STOP-GUARD AUDITS</text>
      
      <text x="20" y="64" class="font" font-size="13" font-weight="800" fill="#0f172a">1. TruncatedPlan:</text>
      <text x="20" y="84" class="font" font-size="13" fill="#047857">Unsatisfied contract items or unexecuted intents.</text>

      <text x="20" y="112" class="font" font-size="13" font-weight="800" fill="#0f172a">2. VerificationMissing:</text>
      <text x="20" y="132" class="font" font-size="13" fill="#047857">Code/files modified without running test commands.</text>

      <text x="20" y="160" class="font" font-size="13" font-weight="800" fill="#0f172a">3. VerificationStale:</text>
      <text x="20" y="180" class="font" font-size="13" font-weight="700" fill="#b91c1c">Edits occurred AFTER tests; must re-verify.</text>
    </g>

    <!-- Block 3.3 -->
    <g transform="translate(28, 455)">
      <rect width="494" height="185" class="box-blue" />
      <text x="20" y="32" class="font" font-size="15" font-weight="800" fill="#1e40af">TASKTOOL: WORKER DE-BLOATING</text>
      <text x="20" y="60" class="font" font-size="13" fill="#1e3a8a">• Heavy intents delegated to depth-1 workers</text>
      <text x="20" y="84" class="font" font-size="13" fill="#1e3a8a">• Isolated session ledger and token budget</text>
      <text x="20" y="108" class="font" font-size="13" fill="#1e3a8a">• Child executes dozens of intermediate turns</text>
      <text x="20" y="132" class="font" font-size="13" fill="#1e3a8a">• Returns ONLY typed TaskOutcome work receipt</text>
      <text x="20" y="160" class="font" font-size="13" font-weight="800" fill="#1d4ed8">Zero intermediate bloat in parent context!</text>
    </g>

    <!-- Block 3.4 -->
    <g transform="translate(28, 660)">
      <rect width="494" height="170" class="box-gray" />
      <text x="20" y="32" class="font" font-size="15" font-weight="800" fill="#0f172a">OUTCOME: ZERO INTENT LOSS</text>
      <text x="20" y="60" class="font" font-size="13" fill="#334155">Whether a task takes 2 turns or 50 turns:</text>
      <text x="20" y="84" class="font" font-size="13" font-weight="600" fill="#0f172a">• Every sub-goal is tracked until observed</text>
      <text x="20" y="108" class="font" font-size="13" font-weight="600" fill="#0f172a">• Context window stays focused and clean</text>
      <text x="20" y="132" class="font" font-size="13" font-weight="700" fill="#059669">• Outcomes delivered with machine-audited proof</text>
    </g>
  </g>
</svg>
