<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      .font { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .bg-canvas { fill: #f8fafc; }
      .card-white { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 14px; }
      .card-vak { fill: #f8fafc; stroke: #2563eb; stroke-width: 2.5; rx: 14px; }
      .badge-vak { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1; rx: 6px; }
      .badge-neutral { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; rx: 6px; }
      .badge-warn { fill: #fffbeb; stroke: #fde68a; stroke-width: 1; rx: 6px; }
      .badge-danger { fill: #fef2f2; stroke: #fca5a5; stroke-width: 1; rx: 6px; }
    </style>
    <filter id="card-shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Clean Light Canvas Background -->
  <rect width="1920" height="1080" class="bg-canvas" />

  <!-- HEADER -->
  <g transform="translate(80, 50)">
    <text x="0" y="44" class="font" font-size="42" font-weight="900" fill="#0f172a" letter-spacing="-1px">Multi-Intent Agent Architectures: A Comparative Trade-off Audit</text>
    <text x="0" y="80" class="font" font-size="19" font-weight="500" fill="#475569">An honest engineering comparison of compound request resolution, context degradation, and verification models</text>
  </g>

  <!-- BENCHMARK TABLE CONTAINER -->
  <g transform="translate(80, 155)" filter="url(#card-shadow)">
    <!-- Outer Card Background -->
    <rect width="1760" height="880" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="18" />

    <!-- Table Column Headers Bar -->
    <rect x="0" y="0" width="1760" height="65" fill="#f1f5f9" rx="18" />
    <rect x="0" y="45" width="1760" height="20" fill="#f1f5f9" />
    <line x1="0" y1="65" x2="1760" y2="65" stroke="#cbd5e1" stroke-width="2" />

    <text x="36" y="40" class="font" font-size="15" font-weight="800" fill="#0f172a" letter-spacing="0.5px">PARADIGM &amp; FRAMEWORK</text>
    <text x="330" y="40" class="font" font-size="15" font-weight="800" fill="#0f172a" letter-spacing="0.5px">COMPOUND RESOLUTION</text>
    <text x="690" y="40" class="font" font-size="15" font-weight="800" fill="#0f172a" letter-spacing="0.5px">SECURITY &amp; CAPABILITY BOUNDS</text>
    <text x="1050" y="40" class="font" font-size="15" font-weight="800" fill="#0f172a" letter-spacing="0.5px">CONTEXT COMPACTION &amp; AUDIT</text>
    <text x="1450" y="40" class="font" font-size="15" font-weight="800" fill="#0f172a" letter-spacing="0.5px">REAL-WORLD LIMITATION</text>

    <!-- ROW 1: STATIC DAGS (LANGGRAPH) -->
    <g transform="translate(20, 80)">
      <rect width="1720" height="120" class="card-white" />
      <text x="24" y="44" class="font" font-size="20" font-weight="800" fill="#0f172a">Pre-Compiled DAGs</text>
      <text x="24" y="68" class="font" font-size="13" font-weight="600" fill="#2563eb">LangGraph / LlamaIndex</text>
      <text x="24" y="94" class="mono" font-size="11" fill="#64748b">Production Maturity: HIGH</text>

      <!-- Compound Resolution -->
      <g transform="translate(310, 18)">
        <text x="0" y="24" class="font" font-size="14" font-weight="700" fill="#0f172a">Pre-Wired Conditional Edges</text>
        <text x="0" y="48" class="font" font-size="13" fill="#475569">Routes along static Python graph nodes.</text>
        <text x="0" y="70" class="font" font-size="12" fill="#059669">✓ Highly predictable for fixed business workflows.</text>
      </g>

      <!-- Security -->
      <g transform="translate(670, 18)">
        <text x="0" y="24" class="font" font-size="14" font-weight="700" fill="#0f172a">Node-Level Code Scoping</text>
        <text x="0" y="48" class="font" font-size="13" fill="#475569">Tools defined per node; ambient credentials.</text>
        <text x="0" y="70" class="font" font-size="12" fill="#d97706">⚠ No formal non-widening algebraic lattice.</text>
      </g>

      <!-- Compaction & Audit -->
      <g transform="translate(1030, 18)">
        <text x="0" y="24" class="font" font-size="14" font-weight="700" fill="#0f172a">State Checkpointer (Postgres)</text>
        <text x="0" y="48" class="font" font-size="13" fill="#475569">Rolling summaries; developer-written test nodes.</text>
        <text x="0" y="70" class="font" font-size="12" fill="#475569">✓ Durable external state persistence.</text>
      </g>

      <!-- Trade-off -->
      <g transform="translate(1430, 18)">
        <rect width="260" height="84" class="badge-warn" />
        <text x="14" y="28" class="font" font-size="13" font-weight="800" fill="#92400e">Topological Fragility</text>
        <text x="14" y="50" class="font" font-size="12" fill="#78350f">Fails when open human prompts</text>
        <text x="14" y="68" class="font" font-size="12" fill="#78350f">violate pre-compiled graph edges.</text>
      </g>
    </g>

    <!-- ROW 2: MULTI-AGENT SWARMS (CREWAI / AUTOGEN) -->
    <g transform="translate(20, 215)">
      <rect width="1720" height="120" class="card-white" />
      <text x="24" y="44" class="font" font-size="20" font-weight="800" fill="#0f172a">Conversational Swarms</text>
      <text x="24" y="68" class="font" font-size="13" font-weight="600" fill="#2563eb">CrewAI / AutoGen</text>
      <text x="24" y="94" class="mono" font-size="11" fill="#64748b">Production Maturity: MODERATE</text>

      <g transform="translate(310, 18)">
        <text x="0" y="24" class="font" font-size="14" font-weight="700" fill="#0f172a">Manager Agent Delegation</text>
        <text x="0" y="48" class="font" font-size="13" fill="#475569">Manager LLM decomposes prompt for sub-agents.</text>
        <text x="0" y="70" class="font" font-size="12" fill="#059669">✓ Natural role-based specialization.</text>
      </g>
      <g transform="translate(670, 18)">
        <text x="0" y="24" class="font" font-size="14" font-weight="700" fill="#0f172a">Ambient Swarm Toolsets</text>
        <text x="0" y="48" class="font" font-size="13" fill="#475569">Tools assigned to individual agent personas.</text>
        <text x="0" y="70" class="font" font-size="12" fill="#dc2626">⚠ "Compound contamination" across chained turns.</text>
      </g>
      <g transform="translate(1030, 18)">
        <text x="0" y="24" class="font" font-size="14" font-weight="700" fill="#0f172a">Group Chat Transcripts</text>
        <text x="0" y="48" class="font" font-size="13" fill="#475569">Chat history replicated; "TERMINATE" string exits.</text>
        <text x="0" y="70" class="font" font-size="12" fill="#dc2626">⚠ Subjective prose completion reviews.</text>
      </g>
      <g transform="translate(1430, 18)">
        <rect width="260" height="84" class="badge-danger" />
        <text x="14" y="28" class="font" font-size="13" font-weight="800" fill="#991b1b">High Token Churn &amp; Latency</text>
        <text x="14" y="50" class="font" font-size="12" fill="#7f1d1d">Agents waste 70%+ of tokens</text>
        <text x="14" y="68" class="font" font-size="12" fill="#7f1d1d">talking to each other; slow handoffs.</text>
      </g>
    </g>

    <!-- ROW 3: UNIFIED HARNESSES (CLAUDE CODE / DEVIN) -->
    <g transform="translate(20, 350)">
      <rect width="1720" height="120" class="card-white" />
      <text x="24" y="44" class="font" font-size="20" font-weight="800" fill="#0f172a">Unified CLI / Coding</text>
      <text x="24" y="68" class="font" font-size="13" font-weight="600" fill="#2563eb">Claude Code / Devin</text>
      <text x="24" y="94" class="mono" font-size="11" fill="#64748b">Production Maturity: HIGH</text>

      <g transform="translate(310, 18)">
        <text x="0" y="24" class="font" font-size="14" font-weight="700" fill="#0f172a">Model Attention &amp; Rules</text>
        <text x="0" y="48" class="font" font-size="13" fill="#475569">Single loop with CLAUDE.md / plan checklists.</text>
        <text x="0" y="70" class="font" font-size="12" fill="#059669">✓ Frictionless developer terminal UX.</text>
      </g>
      <g transform="translate(670, 18)">
        <text x="0" y="24" class="font" font-size="14" font-weight="700" fill="#0f172a">Process Sandbox / Docker</text>
        <text x="0" y="48" class="font" font-size="13" fill="#475569">OS process groups or container jail.</text>
        <text x="0" y="70" class="font" font-size="12" fill="#059669">✓ Strong runtime process isolation.</text>
      </g>
      <g transform="translate(1030, 18)">
        <text x="0" y="24" class="font" font-size="14" font-weight="700" fill="#0f172a">/compact at ~95% &amp; Stop Hooks</text>
        <text x="0" y="48" class="font" font-size="13" fill="#475569">Summarizes history; user-extensible bash hooks.</text>
        <text x="0" y="70" class="font" font-size="12" fill="#d97706">⚠ Model prose can self-certify without tests.</text>
      </g>
      <g transform="translate(1430, 18)">
        <rect width="260" height="84" class="badge-warn" />
        <text x="14" y="28" class="font" font-size="13" font-weight="800" fill="#92400e">Attention Drift Under Bloat</text>
        <text x="14" y="50" class="font" font-size="12" fill="#78350f">Long tool outputs consume context;</text>
        <text x="14" y="68" class="font" font-size="12" fill="#78350f">secondary intents quietly dropped.</text>
      </g>
    </g>

    <!-- ROW 4: ALGEBRAIC KERNEL (VAK) -->
    <g transform="translate(20, 485)">
      <rect width="1720" height="135" class="card-vak" fill="#f0f7ff" />
      <text x="24" y="44" class="font" font-size="22" font-weight="900" fill="#1e3a8a">Algebraic Intent Kernel</text>
      <text x="24" y="70" class="font" font-size="14" font-weight="700" fill="#2563eb">Vak (Research Prototype)</text>
      <text x="24" y="98" class="mono" font-size="11" font-weight="700" fill="#b91c1c">Production Maturity: EXPERIMENTAL (0 USERS)</text>

      <!-- Compound Resolution -->
      <g transform="translate(310, 18)">
        <text x="0" y="24" class="font" font-size="14" font-weight="800" fill="#1e3a8a">7-Axis Lexicon + 50% Band</text>
        <text x="0" y="48" class="font" font-size="13" fill="#1e40af">Unions sibling acts into one turn slice.</text>
        <text x="0" y="70" class="font" font-size="12" font-weight="700" fill="#0369a1">✓ 0 LLM tokens; microsecond extraction.</text>
        <text x="0" y="92" class="font" font-size="11" fill="#b91c1c">⚠ 0.5 threshold is an arbitrary heuristic.</text>
      </g>

      <!-- Security -->
      <g transform="translate(670, 18)">
        <text x="0" y="24" class="font" font-size="14" font-weight="800" fill="#1e3a8a">Bounded Meet-Semilattice</text>
        <text x="0" y="48" class="font" font-size="13" fill="#1e40af">meet(a,b) ⊑ a mathematically proved.</text>
        <text x="0" y="70" class="font" font-size="12" font-weight="700" fill="#0369a1">✓ Intent can NEVER widen permissions.</text>
        <text x="0" y="92" class="font" font-size="11" fill="#0369a1">✓ Highest-caution dominance on ordered axes.</text>
      </g>

      <!-- Compaction & Audit -->
      <g transform="translate(1030, 18)">
        <text x="0" y="24" class="font" font-size="14" font-weight="800" fill="#1e3a8a">Boundary Snapping &amp; StopGuards</text>
        <text x="0" y="48" class="font" font-size="13" fill="#1e40af">Mandatory task preservation; pinned summary.</text>
        <text x="0" y="70" class="font" font-size="12" font-weight="700" fill="#0369a1">✓ Rejects model self-certification in prose.</text>
        <text x="0" y="92" class="font" font-size="11" fill="#0369a1">✓ VerificationStale detects post-test edits.</text>
      </g>

      <!-- Trade-off -->
      <g transform="translate(1430, 18)">
        <rect width="260" height="98" class="badge-danger" />
        <text x="14" y="24" class="font" font-size="13" font-weight="800" fill="#991b1b">Sequential Turn Bottleneck</text>
        <text x="14" y="46" class="font" font-size="12" fill="#7f1d1d">• Cannot run independent intents in parallel.</text>
        <text x="14" y="66" class="font" font-size="12" fill="#7f1d1d">• English-centric regex/lexical heuristics.</text>
        <text x="14" y="86" class="font" font-size="12" fill="#7f1d1d">• False-positive stop-guard traps on docs.</text>
      </g>
    </g>

    <!-- SUMMARY TAKEAWAY BAR -->
    <g transform="translate(20, 640)">
      <rect width="1720" height="210" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="14" />
      <text x="30" y="38" class="font" font-size="18" font-weight="800" fill="#0f172a">CORE ENGINEERING TAKEAWAYS FOR 2026</text>

      <g transform="translate(30, 60)">
        <rect width="520" height="125" fill="#ffffff" stroke="#e2e8f0" rx="10" />
        <text x="20" y="32" class="font" font-size="14" font-weight="800" fill="#0f172a">1. Avoid Single-Label Argmax</text>
        <text x="20" y="58" class="font" font-size="13" fill="#475569">Forcing compound prompts into one act causes</text>
        <text x="20" y="78" class="font" font-size="13" fill="#475569">tool starvation. Unioning contender acts in a single</text>
        <text x="20" y="98" class="font" font-size="13" fill="#475569">turn loop is far more token-efficient than swarms.</text>
      </g>

      <g transform="translate(580, 60)">
        <rect width="520" height="125" fill="#ffffff" stroke="#e2e8f0" rx="10" />
        <text x="20" y="32" class="font" font-size="14" font-weight="800" fill="#0f172a">2. Mathematical Permission Bounds</text>
        <text x="20" y="58" class="font" font-size="13" fill="#475569">Never allow multi-intent chaining to widen permissions.</text>
        <text x="20" y="78" class="font" font-size="13" fill="#475569">A formal meet-semilattice guarantees that compound</text>
        <text x="20" y="98" class="font" font-size="13" fill="#475569">intents can only ever narrow authority, never escalate.</text>
      </g>

      <g transform="translate(1130, 60)">
        <rect width="540" height="125" fill="#ffffff" stroke="#e2e8f0" rx="10" />
        <text x="20" y="32" class="font" font-size="14" font-weight="800" fill="#0f172a">3. Machine-Audited Completion</text>
        <text x="20" y="58" class="font" font-size="13" fill="#475569">Prose completion from an LLM is a hypothesis, not proof.</text>
        <text x="20" y="78" class="font" font-size="13" fill="#475569">Zero-trust stop guards must verify command exit 0</text>
        <text x="20" y="98" class="font" font-size="13" fill="#475569">and audit verification freshness against subsequent edits.</text>
      </g>
    </g>
  </g>
</svg>
