<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap');
      .font { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .bg { fill: #11161d; }
      .bg-split { fill: #18202c; }
      .card-white { fill: #fbfbf9; stroke: #e2e8f0; stroke-width: 2; rx: 16px; }
      .card-dark { fill: #1c2534; stroke: #334155; stroke-width: 2; rx: 16px; }
      .text-hero { font-size: 52px; font-weight: 800; fill: #ffffff; letter-spacing: -1.5px; line-height: 1.15; }
      .text-sub { font-size: 22px; font-weight: 400; fill: #94a3b8; line-height: 1.4; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" class="bg" />
  <path d="M 1250,0 L 1920,0 L 1920,1080 L 1050,1080 Z" class="bg-split" opacity="0.5" />

  <!-- HEADER -->
  <g transform="translate(100, 70)">
    <text x="0" y="45" class="font text-hero">The Multi-Turn Execution Pipeline</text>
    <text x="0" y="85" class="font text-sub">How Vak tracks complex goals, handles multi-sentence prompts, and audits N-turn completion</text>
  </g>

  <!-- 3 COLUMN FLOW -->
  <!-- COLUMN 1: INTENT DECODING (PARAGRAPHS & CLAUSES) -->
  <g transform="translate(100, 190)" filter="url(#shadow)">
    <rect width="530" height="810" class="card-white" />
    <rect width="530" height="60" fill="#f1f5f9" rx="16" />
    <rect y="46" width="530" height="14" fill="#f1f5f9" />
    <text x="28" y="38" class="font" font-size="18" font-weight="700" fill="#0f172a">1. INPUT &amp; CLAUSE DECODING</text>

    <g transform="translate(28, 85)">
      <rect width="474" height="120" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="10" />
      <text x="20" y="30" class="font" font-size="14" font-weight="700" fill="#2563eb">PARAGRAPH EXTRACTION</text>
      <text x="20" y="56" class="font" font-size="14" fill="#475569">• Strips conversational preamble ("please...")</text>
      <text x="20" y="80" class="font" font-size="14" fill="#475569">• Leading imperative verb receives 1.6x weight</text>
      <text x="20" y="104" class="font" font-size="14" fill="#475569">• Bidirectional stemming matches -ing, -ed, -s</text>
    </g>

    <g transform="translate(28, 225)">
      <rect width="474" height="120" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="10" />
      <text x="20" y="30" class="font" font-size="14" font-weight="700" fill="#2563eb">STRUCTURAL HORIZON SIGNALS</text>
      <text x="20" y="56" class="font" font-size="14" fill="#475569">• Length ≥ 400 chars → Horizon::Session</text>
      <text x="20" y="80" class="font" font-size="14" fill="#475569">• Lists ("\n1.", "\n-") → Multi-step session</text>
      <text x="20" y="104" class="font" font-size="14" fill="#475569">• Code blocks / URLs → Analytical/Modify acts</text>
    </g>

    <g transform="translate(28, 365)">
      <rect width="474" height="170" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" rx="10" />
      <text x="20" y="30" class="font" font-size="14" font-weight="700" fill="#1d4ed8">THE CONTENDERS BAND (50%)</text>
      <text x="20" y="56" class="font" font-size="14" fill="#1e40af">Every act scoring ≥ 50% of the winner joins:</text>
      <text x="20" y="82" class="mono" font-size="14" font-weight="600" fill="#1e3a8a">reading.acts() = {Primary ∪ Alternates}</text>
      <text x="20" y="112" class="font" font-size="13" fill="#1e40af">• Capability slice unions all required tools</text>
      <text x="20" y="134" class="font" font-size="13" fill="#1e40af">• Orientation floor [filesystem, memory] stays</text>
      <text x="20" y="156" class="font" font-size="13" fill="#1e40af">• Slicing never starves sibling intents</text>
    </g>

    <g transform="translate(28, 555)">
      <rect width="474" height="225" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="10" />
      <text x="20" y="30" class="font" font-size="14" font-weight="700" fill="#334155">CAUTIOUS AXIS DOMINANCE</text>
      <text x="20" y="58" class="font" font-size="14" fill="#475569"><tspan font-weight="700">Stakes:</tspan> Highest with support wins</text>
      <text x="20" y="80" class="font" font-size="13" fill="#64748b">Inert + Costly + Irreversible → Irreversible</text>
      <text x="20" y="112" class="font" font-size="14" fill="#475569"><tspan font-weight="700">Evidence:</tspan> Strictest proof wins</text>
      <text x="20" y="134" class="font" font-size="13" fill="#64748b">None + Verified → Observed test pass</text>
      <text x="20" y="166" class="font" font-size="14" fill="#475569"><tspan font-weight="700">Checkpoints:</tspan> Taken before any effect</text>
      <text x="20" y="188" class="font" font-size="13" fill="#64748b">Instant rollback if changes go sideways</text>
    </g>
  </g>

  <!-- COLUMN 2: GOAL DRIFT & LIFECYCLE EVOLUTION -->
  <g transform="translate(695, 190)" filter="url(#shadow)">
    <rect width="530" height="810" class="card-white" />
    <rect width="530" height="60" fill="#f1f5f9" rx="16" />
    <rect y="46" width="530" height="14" fill="#f1f5f9" />
    <text x="28" y="38" class="font" font-size="18" font-weight="700" fill="#0f172a">2. GOAL EVOLUTION ACROSS TURNS</text>

    <g transform="translate(28, 85)">
      <rect width="474" height="235" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="10" />
      <text x="20" y="30" class="font" font-size="14" font-weight="700" fill="#7c3aed">TYPED GOAL RELATIONS (goal.rs)</text>
      <text x="20" y="58" class="font" font-size="14" fill="#475569"><tspan font-weight="700" fill="#0f172a">New:</tspan> Fresh objective establishes contract</text>
      <text x="20" y="86" class="font" font-size="14" fill="#475569"><tspan font-weight="700" fill="#0f172a">AddsTo:</tspan> "Also make sure..." → Appends criteria</text>
      <text x="20" y="114" class="font" font-size="14" fill="#475569"><tspan font-weight="700" fill="#0f172a">Corrects:</tspan> "Actually change port to 8080" → Mutates</text>
      <text x="20" y="142" class="font" font-size="14" fill="#475569"><tspan font-weight="700" fill="#0f172a">Replaces:</tspan> "Forget that, do this" → Supersedes</text>
      <text x="20" y="170" class="font" font-size="14" fill="#475569"><tspan font-weight="700" fill="#0f172a">Status:</tspan> "How is it going?" → Non-mutating read</text>
      <text x="20" y="198" class="font" font-size="14" fill="#475569"><tspan font-weight="700" fill="#0f172a">Pauses / Cancels:</tspan> Safe runtime suspension</text>
    </g>

    <g transform="translate(28, 340)">
      <rect width="474" height="200" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" rx="10" />
      <text x="20" y="30" class="font" font-size="14" font-weight="700" fill="#6b21a8">DURABLE COMMITMENTS (vak-commit)</text>
      <text x="20" y="56" class="font" font-size="14" fill="#581c87">When work outlives a turn, sessions become Episodes:</text>
      <text x="20" y="86" class="font" font-size="13" fill="#581c87">• <tspan font-weight="700">Advanced:</tspan> Criteria moved with evidence</text>
      <text x="20" y="110" class="font" font-size="13" fill="#581c87">• <tspan font-weight="700">Learned:</tspan> Epistemic exploration progress</text>
      <text x="20" y="134" class="font" font-size="13" fill="#581c87">• <tspan font-weight="700">Blocked:</tspan> Waiting on external dependency</text>
      <text x="20" y="158" class="font" font-size="13" fill="#b91c1c">• <tspan font-weight="700">Stalled:</tspan> Spent tokens without progress → trips loop breaker</text>
    </g>

    <g transform="translate(28, 560)">
      <rect width="474" height="220" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="10" />
      <text x="20" y="30" class="font" font-size="14" font-weight="700" fill="#334155">TYPED SUSPENSIONS (ZERO TOKENS)</text>
      <text x="20" y="58" class="font" font-size="14" fill="#475569"><tspan font-weight="700">Human:</tspan> Inbox / gateway approval pending</text>
      <text x="20" y="88" class="font" font-size="14" fill="#475569"><tspan font-weight="700">Predicate:</tspan> Background watchdog shell test</text>
      <text x="20" y="110" class="font" font-size="13" fill="#64748b">Consumes ZERO tokens while condition stays false</text>
      <text x="20" y="138" class="font" font-size="14" fill="#475569"><tspan font-weight="700">Schedule:</tspan> Cron / timer wakeup</text>
      <text x="20" y="168" class="font" font-size="14" fill="#475569"><tspan font-weight="700">Lineage:</tspan> Superseded commitments keep audit links</text>
    </g>
  </g>

  <!-- COLUMN 3: RECEIPT-DRIVEN AUDIT & STOP POLICY -->
  <g transform="translate(1290, 190)" filter="url(#shadow)">
    <rect width="530" height="810" class="card-white" />
    <rect width="530" height="60" fill="#f1f5f9" rx="16" />
    <rect y="46" width="530" height="14" fill="#f1f5f9" />
    <text x="28" y="38" class="font" font-size="18" font-weight="700" fill="#0f172a">3. AUDITED COMPLETION GATES</text>

    <g transform="translate(28, 85)">
      <rect width="474" height="235" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" rx="10" />
      <text x="20" y="30" class="font" font-size="14" font-weight="700" fill="#15803d">STOP-POLICY ENFORCEMENT (stop_policy.rs)</text>
      <text x="20" y="56" class="font" font-size="14" fill="#14532d">Real-time ReceiptSummary blocks premature exits:</text>
      
      <text x="20" y="86" class="font" font-size="13" font-weight="600" fill="#991b1b">• TruncatedPlan:</text>
      <text x="32" y="106" class="font" font-size="12" fill="#475569">Blocks if output ends on colon or plan marker</text>

      <text x="20" y="132" class="font" font-size="13" font-weight="600" fill="#991b1b">• VerificationMissing:</text>
      <text x="32" y="152" class="font" font-size="12" fill="#475569">Blocks if task asked to test but no bash ran</text>

      <text x="20" y="178" class="font" font-size="13" font-weight="600" fill="#991b1b">• VerificationStale:</text>
      <text x="32" y="198" class="font" font-size="12" fill="#475569">Blocks if files were modified after last test run</text>
    </g>

    <g transform="translate(28, 340)">
      <rect width="474" height="200" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="10" />
      <text x="20" y="30" class="font" font-size="14" font-weight="700" fill="#0f172a">AUDITED GOAL ACCEPTANCE (goal.rs)</text>
      <text x="20" y="58" class="font" font-size="14" fill="#334155"><tspan font-weight="700">Deterministic verify: Shell Criteria:</tspan></text>
      <text x="20" y="80" class="font" font-size="13" fill="#64748b">Commands like `verify: cargo test` execute locally</text>
      <text x="20" y="100" class="font" font-size="13" fill="#64748b">Must exit 0; zero tolerance for regression</text>

      <text x="20" y="132" class="font" font-size="14" fill="#334155"><tspan font-weight="700">Skeptical Completion Judge:</tspan></text>
      <text x="20" y="154" class="font" font-size="13" fill="#64748b">Semantic criteria judged against transcript + git diff</text>
      <text x="20" y="174" class="font" font-size="13" fill="#64748b">Strict JSON verdict: pass | fail | unknown</text>
    </g>

    <g transform="translate(28, 560)">
      <rect width="474" height="220" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" rx="10" />
      <text x="20" y="30" class="font" font-size="14" font-weight="700" fill="#991b1b">SUBAGENT DELEGATION (TaskTool)</text>
      <text x="20" y="58" class="font" font-size="14" fill="#7f1d1d">• Root agent decomposes complex work into children</text>
      <text x="20" y="82" class="font" font-size="14" fill="#7f1d1d">• Depth-1 construction: child cannot spawn children</text>
      <text x="20" y="106" class="font" font-size="14" fill="#7f1d1d">• Isolated tool subset (e.g. read-only subagents)</text>
      <text x="20" y="130" class="font" font-size="14" fill="#7f1d1d">• Discrete budget &amp; turn limits</text>
      <text x="20" y="154" class="font" font-size="14" fill="#7f1d1d">• Child reports structured output back to parent</text>
      <text x="20" y="186" class="font" font-size="13" font-weight="600" fill="#991b1b">Auditable lineage recorded in JSONL session logs</text>
    </g>
  </g>
</svg>
