<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Two values so the browser's own chrome matches the palette in
         force rather than always painting the dark one. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f1ea" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171714" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vakyartha" />
    <!-- Installable from a browser; the manifest is only meaningful for the
         web build, and is inert (a 404 the browser ignores) in the Tauri
         shell, which is already an installed app. -->
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/vak-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/apple-touch-icon.png" />
    <title>Vakyartha</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
