[package]
name = "vak-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-support = ["vak-mail-calendar/test-support"]

[dependencies]
base64 = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
uuid = { workspace = true }
vak-agent = { workspace = true }
vak-config = { workspace = true }
vak-permission = { workspace = true }
vak-commit = { workspace = true }
vak-core = { workspace = true }
vak-intent = { workspace = true }
vak-plugin = { workspace = true }
vak-delivery = { workspace = true }
vak-llm = { workspace = true }
vak-voice = { workspace = true }
futures = { workspace = true }
vak-ops = { path = "../vak-ops" }
vak-session = { workspace = true }
vak-store = { workspace = true }
vak-presentation = { workspace = true }
vak-flow = { workspace = true }
vak-hooks = { workspace = true }
tower-http = { workspace = true }
subtle = { workspace = true }
# Decodes the ?token= query parameter EventSource clients must use.
percent-encoding = "2"
include_dir = { workspace = true }
# One PTY implementation, shared by the desktop shell and the web client.
portable-pty = { workspace = true }
chrono = { workspace = true }
walkdir = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
webauthn-rs = { workspace = true }
url = "2"
getrandom = "0.3"
fs2 = "0.4"
thiserror = { workspace = true }
# Script-task watchdogs execute through the same brokered BashTool the agent
# loop uses (docs/design/29-personal-os.md P2); this pulls in the Tool
# trait + ToolContext needed to drive it from the scheduler.
vak-tools = { workspace = true }
vak-sandbox = { workspace = true }
vak-ooxml = { workspace = true }
vak-pdf = { workspace = true }
vak-bus = { workspace = true }
vak-mail-calendar = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
vak-mail-calendar = { workspace = true }
vak-ooxml = { workspace = true, features = ["fixtures"] }
vak-pdf = { workspace = true, features = ["fixtures"] }
# A real WebSocket client for the /voice/session end-to-end test.
tokio-tungstenite = { workspace = true }
tempfile = { workspace = true }
libc = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
webauthn-authenticator-rs = { workspace = true }

[lints]
workspace = true

[build-dependencies]
# build.rs re-verifies the committed admin bundle against its sources.
sha2 = { workspace = true }
