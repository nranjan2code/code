<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:type" content="website" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#FFFFFF"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#10121A"
    />
    <link rel="icon" type="image/png" href="/app/assets/brand/icon-192.png" />
    <script>
      try {
        var t = localStorage.getItem("vak-theme");
        if (t === "light" || t === "dark")
          document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      {{STYLES}}
    </style>
  </head>
  <body class="{{BODY_CLASS}}">
    <a class="skip" href="#main">Skip to content</a>
    <header class="rail">
      <div class="wrap rail-inner">
        <a class="brand" href="/" aria-label="Vakyartha home"
          ><span class="brand-bird" aria-hidden="true"></span
          ><span class="brand-word" aria-hidden="true"></span
        ></a>
        <nav class="rail-nav" aria-label="Main navigation">{{NAV}}</nav>
        <div class="rail-actions">
          <button
            class="theme-button"
            id="theme"
            type="button"
            aria-label="Switch theme"
            hidden
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 1v3m0 16v3M1 12h3m16 0h3M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2"
              />
            </svg></button
          ><a class="button primary" href="/install"
            >Get started <span aria-hidden="true">↗</span></a
          >
        </div>
      </div>
    </header>
    <main id="main">{{BODY}}</main>
    <footer class="footer">
      <div class="wrap footer-inner">
        <a class="brand" href="/" aria-label="Vakyartha home"
          ><span class="brand-bird" aria-hidden="true"></span
          ><span class="brand-word" aria-hidden="true"></span
        ></a>
        <p>Ask. Then go live your day.</p>
        <nav aria-label="More about Vakyartha">
          <a href="/vak">Our name</a><a href="/surfaces">Ways to use it</a
          ><a href="/security">Your control</a
          ><a href="/architecture">Architecture</a><a href="/doctor">Doctor</a><a href="/wallpapers">Wallpapers</a><a href="/install">Get started</a>
        </nav>
        <nav class="footer-project" aria-label="Project and policies">
          <a href="https://github.com/nranjan2code/code" target="_blank" rel="noopener noreferrer">Source code</a>
          <a href="https://github.com/nranjan2code/code/issues" target="_blank" rel="noopener noreferrer">Support</a>
          <a href="/privacy">Privacy</a>
          <a href="/terms">Terms of use</a>
        </nav>
        <details class="build-details">
          <summary>Build details</summary>
          <span id="build-stamp"
            >Build information is available on a running Vakyartha server.</span
          >
        </details>
      </div>
    </footer>
    <script src="{{MOTION_SRC}}" defer></script>
    <!-- prettier-ignore -->
    <script>{{SCRIPT}}</script>
  </body>
</html>
