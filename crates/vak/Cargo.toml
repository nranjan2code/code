[package]
name = "vak"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vak"
path = "src/main.rs"

[dependencies]
percent-encoding = "2"
vak-agent = { workspace = true }
# `Approver` is an async trait; the terminal question prompt implements it.
async-trait = { workspace = true }
vak-config = { workspace = true }
vak-commit = { workspace = true }
vak-core = { workspace = true }
vak-intent = { workspace = true }
vak-delivery = { workspace = true }
vak-eval = { workspace = true }
vak-flow = { workspace = true }
vak-llm = { workspace = true }
vak-server = { workspace = true }
vak-presentation = { workspace = true }
vak-session = { workspace = true }
vak-terminal = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
vak-ops = { workspace = true }
chrono = { workspace = true }
vak-permission = { workspace = true }
vak-plugin = { workspace = true }
vak-tools = { workspace = true }
vak-ooxml = { workspace = true }
vak-pdf = { workspace = true }
vak-sandbox = { workspace = true }
# Opt-in update check ([update] url, docs/design/29 P3); blocking client on
# its own thread so startup never waits past the 2s timeout.
reqwest = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tempfile = { workspace = true }
similar = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
vak-ooxml = { workspace = true, features = ["fixtures"] }
vak-pdf = { workspace = true, features = ["fixtures"] }
