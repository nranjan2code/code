[package]
name = "vakcoder"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["tui"]
tui = ["dep:vak-tui"]

[[bin]]
name = "vakcoder"
path = "src/main.rs"

[dependencies]
vak-tui = { workspace = true, optional = true }
clap = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
vak-ops = { workspace = true }
chrono = { workspace = true }
vak-tools = { workspace = true }
vak-runtime = { workspace = true }
vak-config = { workspace = true }
vak-server = { workspace = true }
vak-client = { workspace = true }
vak-domain = { workspace = true }
# Opt-in update check ([update] url, docs/design/29 P3); blocking client on
# its own thread so startup never waits past the 2s timeout.
reqwest = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
