name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The stamps a person reads (README badge, CHANGELOG, git tags), and a
      # version that moves backwards — which silently strands every install
      # on the higher line, because update checks compare by semver
      # precedence. The workspace went 0.11.51 -> 0.2.0 with nothing to say so.
      - name: version singularity
        run: scripts/check-version.sh

  admin-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/vak-admin-ui/package-lock.json
      - working-directory: crates/vak-admin-ui
        run: npm ci
      - name: typecheck admin
        working-directory: crates/vak-admin-ui
        run: npm run check
      - name: build admin
        working-directory: crates/vak-admin-ui
        run: npm run build
      - working-directory: crates/vak-client-ui
        run: npm ci
      - name: typecheck client
        working-directory: crates/vak-client-ui
        run: npm run typecheck
      # Builds BOTH bundles: dist/ for the Tauri shell and dist-web/ for the
      # copy vak-server embeds at /app (docs/design/48-web-client.md).
      - name: build client
        working-directory: crates/vak-client-ui
        run: npm run build
      # Both committed bundles are embedded into vak-server at compile time
      # (include_dir!) — only what is on disk ships. v0.8.1 shipped a blank
      # admin console because src/ had a real fix that dist/ was never
      # rebuilt from, and nothing caught the mismatch before release (see
      # scripts/release.sh). This makes that drift fail on every push, not
      # just at release time.
      #
      # crates/vak-client-ui/dist/ is deliberately NOT checked: it is
      # gitignored, because only vak-desktop ships it and building the
      # desktop already requires npm.
      # The public site at `/` is the third embedded bundle and has exactly
      # the same trap, minus npm: `site/dist` is committed and embedded, so
      # editing `site/src` without re-running the builder ships the previous
      # pages. `--check` rebuilds in memory and diffs, so it also catches a
      # dist/ edited by hand.
      - name: build site
        run: python3 crates/vak-server/site/build.py --check
      - name: committed bundles match source
        run: |
          for bundle in crates/vak-admin-ui/dist crates/vak-client-ui/dist-web crates/vak-server/site/dist; do
            if [ -n "$(git status --porcelain -- "$bundle")" ]; then
              echo "::error::$bundle does not match its source." >&2
              echo "Rebuild locally and commit it:" >&2
              echo "  UI bundles: npm run build in that crate" >&2
              echo "  site:       python3 crates/vak-server/site/build.py" >&2
              git status --short -- "$bundle" >&2
              exit 1
            fi
          done

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: doc citations resolve
        run: python3 scripts/check_doc_paths.py
      # Everything in doc 46 Part VII is a promise; this is the machine
      # that keeps it. Runs on every push because the regression it catches
      # -- an update quietly losing durable state -- is invisible until
      # someone has already lost data.
      - name: upgrade gate
        run: ./scripts/upgrade-gate.sh
      # An unavailable check is a failure, not a pass (doc 46 Part V): a
      # missing audit tool must fail rather than silently skip the gate.
      - name: advisory gate
        run: |
          cargo install cargo-audit --locked
          cargo audit
      # The linux job already runs ON Linux, so it exercises the same
      # properties `scripts/linux-check.sh` puts in a container for a macOS
      # developer: install starts nothing, setup refuses a missing choice,
      # and the headless web surface serves and authenticates.
      - name: linux install and setup path
        run: |
          cargo build --release --package vak
          VAK=target/release/vak
          export VAK_HOME=/tmp/vak-home
          PREFIX=/tmp/vak-prefix
          "$VAK" self install --prefix "$PREFIX" --force
          test ! -d "$VAK_HOME/sessions" || { echo "install created state"; exit 1; }
          mkdir -p /tmp/workspace && cd /tmp/workspace
          code=0; "$PREFIX/bin/vak" setup --non-interactive </dev/null >/dev/null 2>&1 || code=$?
          test "$code" -eq 2 || { echo "expected refusal, got $code"; exit 1; }
          VAK_SETUP_PROVIDER=ollama VAK_SETUP_MODEL=llama3 \
          VAK_SETUP_POSTURE=workspace-write VAK_SETUP_SEED=1 \
            "$PREFIX/bin/vak" setup --non-interactive </dev/null >/dev/null 2>&1
          test -d "$VAK_HOME/vak-home/.vak/skills" || { echo "seeding did not run"; exit 1; }
          "$PREFIX/bin/vak" self uninstall --yes --purge --prefix "$PREFIX" >/dev/null
          test ! -e "$VAK_HOME/vak-home/.vak/config.toml" || { echo "purge left state"; exit 1; }

      - name: Landlock sandbox smoke (Linux 5.13+ runners)
        run: |
          cargo build -p vak
          chmod +x scripts/landlock_smoke.sh
          ./scripts/landlock_smoke.sh target/debug/vak
