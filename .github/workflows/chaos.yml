name: chaos-live

# Live-model fault-injection campaign against OpenCode Zen (Ox Alpha Free).
# Deterministic failure-handling regressions run on every PR in ci.yml via
# cargo test (scripted providers, no network). This job exercises the full
# binary end-to-end through a fault-injecting proxy with the real model.
# MANUAL ONLY (workflow_dispatch): live-model runner time is paid per minute,
# so nothing here runs on a schedule.
on:
  workflow_dispatch:

jobs:
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install test deps
        run: python3 -m pip install pytest
      - name: Build
        run: cargo build --locked -p vak
      - name: Start fault proxy
        run: |
          printf 'pass' > /tmp/fault_mode
          nohup python3 scripts/fault_proxy.py 8930 > /tmp/proxy.log 2>&1 &
          sleep 1
          curl -s http://127.0.0.1:8930/hits
      - name: Live eval suite
        run: target/debug/vak eval --live --provider opencode-zen --model x-preview-f-free
      - name: Chaos campaign
        run: |
          # Sessions are per-cwd-hashed: the seed session must be minted in
          # the SAME workspace the driver executes in.
          mkdir -p /tmp/vak-chaos-workspace
          cd /tmp/vak-chaos-workspace
          git init -q .
          SID=$(VAK_OPENCODE_ZEN_BASE_URL=http://127.0.0.1:8930 \
            "$GITHUB_WORKSPACE/target/debug/vak" exec \
            --provider opencode-zen --model x-preview-f-free \
            "Reply with exactly: ready" --trust --yes --max-turns 2 2>&1 \
            | grep -oE "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}" \
            | head -1)
          echo "session: $SID"
          cd "$GITHUB_WORKSPACE"
          VAK_BIN="$PWD/target/debug/vak" \
          python3 scripts/chaos_driver.py "$SID"
      - name: Upload artifacts (logs, ledgers)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-logs
          path: |
            /tmp/chaos*.log
            /tmp/proxy.log
          if-no-files-found: ignore
